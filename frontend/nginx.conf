server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 入口 HTML 必须每次向服务端校验，否则浏览器会拿着旧入口
    # 去加载已被新构建替换掉的旧哈希资源，表现为"清缓存才更新、新开窗口又变旧"。
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # 前端页面路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端
    #
    # 注意：这里用变量 + resolver 延迟解析，而不是直接写 http://backend:8080。
    # 直写上游时 nginx 会在「启动那一刻」解析 backend，若后端容器尚未就绪，
    # nginx 会直接以 [emerg] host not found in upstream 退出（容器 Exited 1），
    # 表现为"前端单独启动就崩"。改用变量后，解析推迟到每次请求，后端晚起也能自愈。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带哈希指纹的静态资源可以长期缓存；文件名一变缓存自然失效。
    # 注意：index.html 不在这个规则内（见上方的 no-store 配置）。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 部署自检：/build-info.json 反映镜像内的构建时间，用于确认容器是否为新镜像
    location = /build-info.json {
        expires off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
