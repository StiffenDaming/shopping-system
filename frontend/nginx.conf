server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 入口 HTML 必须每次向服务端校验，否则浏览器会拿着旧入口
    # 去加载已被新构建替换掉的旧哈希资源，表现为"清缓存才更新、新开窗口又变旧"。
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # 前端页面路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带哈希指纹的静态资源可以长期缓存；文件名一变缓存自然失效。
    # 注意：index.html 不在这个规则内（见上方的 no-store 配置）。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 部署自检：/build-info.json 反映镜像内的构建时间，用于确认容器是否为新镜像
    location = /build-info.json {
        expires off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
