server:
  port: 8080

spring:
  profiles:
    active: mysql
  application:
    name: shopping-system
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jmx:
    enabled: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ZGVtbw==c2hvcHBpbmctc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjAyNg==
  expiration: 86400000  # 24小时(毫秒)

# 业务配置
app:
  upload-path: ./uploads/

# 大模型配置（DeepSeek）
# API Key 通过环境变量注入，切勿写入代码或提交到仓库：
#   export LLM_API_KEY=sk-xxxx
# 未配置时，标签抽取与推荐理由生成自动降级为规则策略，不影响系统其他功能。
llm:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  model: ${LLM_MODEL:deepseek-flash}
  timeout-seconds: 30

# 推荐模块配置
recommend:
  # 时间衰减系数 λ：权重 = 基础权重 × exp(-λ × 天数)，λ=0.05 约等于 14 天半衰期
  decay-lambda: 0.05
  # 热度分权重：订单、加购、浏览
  hot-weight-order: 3
  hot-weight-cart: 2
  hot-weight-view: 1
  # 混合推荐权重：内容过滤、热度、协同过滤
  hybrid-alpha: 0.6
  hybrid-beta: 0.3
  hybrid-gamma: 0.1

---
# ===== MySQL 本地开发配置 =====
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/shopping?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql

---
# ===== Docker 部署配置 =====
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/shopping?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
  jmx:
    enabled: false
